<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Details - TasteKolhapur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300">

  <div id="navbar-container"></div>

  <main class="page-container py-8 min-h-screen">
    <div id="loading-state" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin w-10 h-10 border-4 border-orange-200 border-t-orange-500 rounded-full mb-4"></div>
      <p class="text-gray-500">Loading restaurant details...</p>
    </div>

    <div id="content-state" class="hidden">
      <!-- Header -->
      <div class="relative h-64 md:h-80 rounded-3xl overflow-hidden mb-8">
        <img id="rest-image" src="" alt="Restaurant" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
        <div class="absolute bottom-0 left-0 right-0 p-8 text-white">
          <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <div class="flex items-center gap-2 mb-2">
                <span id="rest-status" class="px-2 py-1 bg-gray-800 text-gray-300 rounded-full text-[10px] font-bold"></span>
              </div>
              <h1 id="rest-name" class="font-display font-black text-4xl mb-2"></h1>
              <div class="flex items-center gap-4 text-white/80 text-sm mt-1">
                <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-4 h-4"></i> <span id="rest-area"></span></span>
              </div>
            </div>
            <div class="flex gap-2">
              <button class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm hover:bg-white/30 transition-colors">
                <i data-lucide="share-2" class="w-4 h-4"></i>
              </button>
              <button class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm hover:bg-white/30 transition-colors">
                <i data-lucide="heart" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Main Content -->
        <div class="lg:col-span-2 space-y-8">
          
          <!-- Rating Row -->
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-wrap gap-6 items-center">
            <div class="text-center pr-6 border-r border-gray-100">
              <div class="text-4xl font-display font-black text-gradient" id="rest-avg-score">-</div>
              <p class="text-xs text-gray-500 mt-1"><span id="rest-review-count">0</span> reviews</p>
            </div>
            
            <div class="text-center pr-6 border-r border-gray-100 hidden" id="google-rating-container">
              <div class="text-2xl font-display font-bold" id="rest-google-rating">-</div>
              <p class="text-xs text-gray-500">Google</p>
            </div>

            <div class="text-center" id="mps-container">
              <div class="text-2xl font-display font-bold text-orange-500"><span id="rest-mps">-</span><span class="text-sm">/10</span></div>
              <p id="rest-mps-tier" class="text-xs font-semibold"></p>
              <p class="text-xs text-gray-500">MPS Score</p>
            </div>

            <div class="ml-auto">
              <button id="show-review-modal-btn" class="px-6 py-2 bg-gradient-misal text-white rounded-xl font-medium hidden flex items-center gap-2">
                <i data-lucide="star" class="w-4 h-4"></i> Write Review
              </button>
              <a href="/login.html" id="login-to-review-btn" class="px-6 py-2 bg-gray-100 text-gray-700 rounded-xl font-medium inline-block hidden">Sign in to Review</a>
            </div>
          </div>

          <!-- About -->
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-bold mb-4">About</h2>
            <p id="rest-desc" class="text-gray-600 leading-relaxed"></p>
            
            <h3 class="font-bold mt-6 mb-3">Features</h3>
            <div id="rest-features" class="flex flex-wrap gap-2"></div>
          </div>

          <!-- Reviews Section -->
          <div>
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
              <i data-lucide="message-square" class="text-orange-500"></i> Customer Reviews
            </h2>
            
            <!-- Review List -->
            <div id="reviews-list" class="space-y-4"></div>
          </div>
        </div>

        <!-- Sidebar -->
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 sticky top-24">
            <h3 class="font-bold mb-4">Location & Contact</h3>
            <p id="rest-address" class="text-sm text-gray-600 mb-4 flex gap-2">
              <i data-lucide="map-pin" class="w-4 h-4 mt-0.5 text-gray-400"></i> <span></span>
            </p>
            <p id="rest-phone" class="text-sm text-gray-600 mb-6 flex gap-2">
              <i data-lucide="phone" class="w-4 h-4 text-gray-400"></i> <span></span>
            </p>
            <a id="rest-directions" href="#" target="_blank" class="block w-full py-2.5 bg-gray-100 text-center font-medium text-gray-800 rounded-xl hover:bg-gray-200 transition-colors">
              Get Directions
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Review Modal Overlay -->
  <div id="review-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 hidden backdrop-blur-sm">
    <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl relative">
      <div class="sticky top-0 bg-white border-b border-gray-100 p-4 flex items-center justify-between z-10 rounded-t-3xl">
        <h2 class="font-bold text-xl">Write a Review</h2>
        <button id="close-review-modal" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="review-form" class="p-6 space-y-6">
        <div>
          <label class="block font-bold mb-2">Overall Rating</label>
          <input type="number" id="rating-input" min="1" max="5" step="0.5" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-orange-500 outline-none" placeholder="1 to 5">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Taste</label>
            <input type="number" id="sr-taste" min="1" max="5" class="w-full p-2 border border-gray-200 rounded-xl" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Spice Level</label>
            <input type="number" id="sr-spice" min="1" max="5" class="w-full p-2 border border-gray-200 rounded-xl" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Service</label>
            <input type="number" id="sr-service" min="1" max="5" class="w-full p-2 border border-gray-200 rounded-xl" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Cleanliness</label>
            <input type="number" id="sr-clean" min="1" max="5" class="w-full p-2 border border-gray-200 rounded-xl" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ambience</label>
            <input type="number" id="sr-ambience" min="1" max="5" class="w-full p-2 border border-gray-200 rounded-xl" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Value for Money</label>
            <input type="number" id="sr-value" min="1" max="5" class="w-full p-2 border border-gray-200 rounded-xl" required>
          </div>
        </div>

        <div>
          <label class="block font-bold mb-2">Your Review (min 20 chars)</label>
          <textarea id="comment-input" required minlength="20" rows="4" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-orange-500 outline-none resize-none" placeholder="Share the details of your visit..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Favourite Dish</label>
            <input type="text" id="fav-dish" class="w-full p-3 border border-gray-200 rounded-xl outline-none" placeholder="e.g. Kolhapuri Misal">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Amount Spent (₹)</label>
            <input type="number" id="amount-spent" class="w-full p-3 border border-gray-200 rounded-xl outline-none" placeholder="e.g. 150">
          </div>
        </div>

        <div class="flex gap-4 items-center">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="would-recommend" class="w-5 h-5 rounded text-orange-500" checked>
            <span class="font-medium">I recommend this place</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="would-visit" class="w-5 h-5 rounded text-orange-500" checked>
            <span class="font-medium">Will visit again</span>
          </label>
        </div>

        <div class="pt-4 border-t border-gray-100 flex justify-end gap-3">
          <button type="button" id="cancel-review-btn" class="px-6 py-2 border border-gray-200 rounded-xl font-medium">Cancel</button>
          <button type="submit" class="px-8 py-2 bg-gradient-misal text-white rounded-xl font-medium hover:opacity-90">Post Review</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/restaurant.js"></script>
</body>
</html>
