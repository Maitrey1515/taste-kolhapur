<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - TasteKolhapur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300">

  <div id="navbar-container"></div>

  <main class="page-container py-12 min-h-screen">
    
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
      <div>
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 rounded-xl bg-orange-100 flex items-center justify-center">
            <i data-lucide="calendar" class="w-5 h-5 text-orange-500"></i>
          </div>
          <h1 class="text-3xl font-display font-bold">Events</h1>
        </div>
        <p class="text-gray-500 text-sm max-w-xl">
          Discover Misal festivals, special menus, eating competitions, and more happenings around Kolhapur.
        </p>
      </div>

      <div class="flex gap-3 w-full md:w-auto">
        <div class="relative flex-1 md:w-64">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
          <input type="text" id="event-search" placeholder="Search events..." class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-xl focus:ring-orange-500 outline-none">
        </div>
        <select id="event-filter" class="px-3 py-2 border border-gray-200 rounded-xl w-36 outline-none">
          <option value="upcoming">Upcoming</option>
          <option value="past">Past Events</option>
          <option value="all">All Events</option>
        </select>
      </div>
    </div>

    <div id="loading-state" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin w-10 h-10 border-4 border-orange-200 border-t-orange-500 rounded-full mb-4"></div>
      <p class="text-gray-500">Loading events...</p>
    </div>

    <div id="events-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
      <!-- Populated by JS -->
    </div>

  </main>

  <script type="module">
    import { initAuth } from './js/auth.js';
    import { initNavbar } from './js/navbar.js';
    import { db } from './js/firebase-config.js';
    import { collection, query, where, orderBy, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    initAuth();
    initNavbar();

    let allEvents = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await fetchEvents();
      if (window.lucide) window.lucide.createIcons();
    });

    async function fetchEvents() {
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('events-grid').classList.add('hidden');
      try {
        const filter = document.getElementById('event-filter').value;
        let q = query(collection(db, 'restaurant_events'), where('is_active', '==', true));
        
        const today = new Date().toISOString().split('T')[0];
        if (filter === 'upcoming') {
          q = query(q, where('start_date', '>=', today), orderBy('start_date', 'asc'));
        } else if (filter === 'past') {
          q = query(q, where('start_date', '<', today), orderBy('start_date', 'desc'));
        } else {
          q = query(q, orderBy('start_date', 'desc'));
        }
        
        const snap = await getDocs(q);
        const data = await Promise.all(snap.docs.map(async d => {
          const ev = { id: d.id, ...d.data() };
          if (ev.restaurant_id) {
            const rDoc = await getDoc(doc(db, 'restaurants', ev.restaurant_id));
            if (rDoc.exists()) ev.restaurant = { name: rDoc.data().name, area: rDoc.data().area };
          }
          return ev;
        }));
        
        allEvents = data;
        renderEvents();
      } catch (e) {
        console.error(e);
        document.getElementById('loading-state').innerHTML = `<p class="text-red-500 font-bold">Failed to load events.</p>`;
      }
    }

    function renderEvents() {
      const search = document.getElementById('event-search').value.toLowerCase();
      const filtered = allEvents.filter(e => 
        e.title.toLowerCase().includes(search) || 
        (e.restaurant?.name || '').toLowerCase().includes(search)
      );

      const grid = document.getElementById('events-grid');
      document.getElementById('loading-state').classList.add('hidden');
      grid.classList.remove('hidden');

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-20"><p class="text-gray-500">No events found.</p></div>`;
        return;
      }

      grid.innerHTML = filtered.map(ev => `
        <div class="bg-white border border-gray-100 rounded-2xl overflow-hidden hover:shadow-lg transition-shadow flex flex-col">
          ${ev.image ? `<img src="${ev.image}" class="w-full h-40 object-cover" />` : `<div class="w-full h-40 bg-gray-200"></div>`}
          <div class="p-4 flex-1 flex flex-col">
            <h3 class="font-bold text-lg mb-2">${ev.title}</h3>
            <div class="flex items-center gap-2 text-sm text-gray-500 mb-1">
              <i data-lucide="calendar" class="w-4 h-4"></i> ${new Date(ev.start_date).toLocaleDateString()}
            </div>
            ${ev.restaurant ? `
            <div class="flex items-center gap-2 text-sm text-gray-500 mb-4">
              <i data-lucide="map-pin" class="w-4 h-4"></i> <a href="/restaurant.html?id=${ev.restaurant_id}" class="hover:text-orange-500 transition-colors">${ev.restaurant.name}</a>
            </div>` : ''}
            <p class="text-sm text-gray-600 line-clamp-3 mt-auto">${ev.description}</p>
          </div>
        </div>
      `).join('');
      if (window.lucide) window.lucide.createIcons();
    }

    document.getElementById('event-search').addEventListener('input', renderEvents);
    document.getElementById('event-filter').addEventListener('change', fetchEvents);

  </script>
</body>
</html>
