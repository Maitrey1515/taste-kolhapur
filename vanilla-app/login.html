<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - TasteKolhapur</title>
  <!-- Tailwind CSS via CDN for styling as per phase 1 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-gradient-misal mx-auto flex items-center justify-center mb-4">
        <i data-lucide="utensils-crossed" class="text-white"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-900">Welcome Back</h2>
      <p class="text-gray-500 mt-2">Sign in to TasteKolhapur</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i data-lucide="mail" class="w-4 h-4 text-gray-400"></i>
          </div>
          <input type="email" id="email" required
            class="pl-10 w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i data-lucide="lock" class="w-4 h-4 text-gray-400"></i>
          </div>
          <input type="password" id="password" required
            class="pl-10 w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all">
        </div>
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" class="rounded text-orange-500 focus:ring-orange-500">
          <span class="text-gray-600">Remember me</span>
        </label>
        <a href="#" class="text-orange-600 font-medium hover:text-orange-700">Forgot password?</a>
      </div>

      <button type="submit" id="submit-btn" class="w-full py-2.5 bg-gradient-misal text-white rounded-xl font-medium hover:opacity-90 transition-opacity flex justify-center items-center gap-2">
        Sign In
      </button>
    </form>

    <div class="mt-6 relative">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-200"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-white text-gray-500">Or continue with</span>
      </div>
    </div>

    <button id="google-btn" type="button" class="mt-6 w-full flex items-center justify-center gap-3 px-4 py-2.5 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
      <span class="font-medium text-gray-700">Google</span>
    </button>

    <p class="mt-8 text-center text-sm text-gray-600">
      Don't have an account? 
      <a href="/signup.html" class="text-orange-600 font-medium hover:text-orange-700">Sign up</a>
    </p>
  </div>

  <script type="module">
    import { initAuth, signIn, signInWithGoogle, AuthState } from './js/auth.js';
    import { showGlobalLoading } from './js/utils.js';

    lucide.createIcons();
    initAuth();

    // Redirect if already logged in
    import { subscribeToAuth } from './js/auth.js';
    subscribeToAuth((user) => {
      if (user) window.location.href = '/index.html';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      showGlobalLoading(true);
      const { error } = await signIn(email, password);
      showGlobalLoading(false);
      
      if (error) alert('Error: ' + error.message);
    });

    document.getElementById('google-btn').addEventListener('click', async () => {
      const { error } = await signInWithGoogle();
      if (error) alert('Error: ' + error.message);
    });
  </script>
</body>
</html>
