<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard - TasteKolhapur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300">

  <div id="navbar-container"></div>

  <main class="page-container py-8 space-y-8 min-h-screen">
    
    <div id="loading-state" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin w-10 h-10 border-4 border-orange-200 border-t-orange-500 rounded-full mb-4"></div>
      <p class="text-gray-500">Loading dashboard...</p>
    </div>

    <div id="dashboard-content" class="hidden space-y-8">
      
      <!-- Restaurant Header -->
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-orange-200 bg-gradient-to-br from-orange-50 to-transparent">
        <div class="flex items-center gap-4 mb-4">
          <div class="w-16 h-16 rounded-xl bg-gradient-misal p-0.5">
            <div class="w-full h-full bg-white rounded-[10px] flex items-center justify-center">
              <i data-lucide="store" class="w-8 h-8 text-orange-500"></i>
            </div>
          </div>
          <div>
            <h1 id="rest-name" class="text-2xl font-display font-bold text-gray-900"></h1>
            <p id="rest-area" class="text-sm text-gray-500"></p>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
          <div class="bg-white p-4 rounded-xl border border-gray-100 text-center">
            <p class="text-xs text-gray-500 uppercase tracking-wide font-bold mb-1">Rating</p>
            <p class="text-2xl font-display font-black text-amber-500" id="stat-rating">-</p>
          </div>
          <div class="bg-white p-4 rounded-xl border border-gray-100 text-center">
            <p class="text-xs text-gray-500 uppercase tracking-wide font-bold mb-1">Reviews</p>
            <p class="text-2xl font-display font-black text-gray-900" id="stat-reviews">-</p>
          </div>
          <div class="bg-white p-4 rounded-xl border border-gray-100 text-center">
            <p class="text-xs text-gray-500 uppercase tracking-wide font-bold mb-1">Profile Views</p>
            <p class="text-2xl font-display font-black text-gray-900">1,245</p>
          </div>
          <div class="bg-white p-4 rounded-xl border border-gray-100 text-center">
            <p class="text-xs text-gray-500 uppercase tracking-wide font-bold mb-1">QR Scans</p>
            <p class="text-2xl font-display font-black text-gray-900">342</p>
          </div>
        </div>
      </div>

      <!-- Recent Reviews -->
      <div>
        <h2 class="text-xl font-display font-bold mb-4">Recent Reviews</h2>
        <div id="reviews-list" class="space-y-4">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- QR Code / URL -->
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 text-center max-w-sm mx-auto">
        <h3 class="font-bold mb-2">Your Restaurant URL</h3>
        <p class="text-sm text-gray-500 mb-4">Share this link or generate a QR code for customers to leave verified reviews.</p>
        <input type="text" id="rest-url" readonly class="w-full p-2 border border-gray-200 rounded-lg bg-gray-50 text-center text-sm font-mono mb-4">
        <button onclick="navigator.clipboard.writeText(document.getElementById('rest-url').value); alert('Copied!')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium w-full hover:bg-gray-200">
          Copy Link
        </button>
      </div>

    </div>
  </main>

  <script type="module" src="js/dashboard-owner.js"></script>
</body>
</html>
