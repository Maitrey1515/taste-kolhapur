<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Misal - TasteKolhapur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300">

  <div id="navbar-container"></div>

  <main class="page-container py-8 min-h-screen">
    <!-- Header + Search -->
    <div class="mb-6">
      <h1 class="text-3xl font-display font-bold text-gray-900 mb-4">Discover Misal in Kolhapur</h1>
      
      <form id="search-form" class="flex gap-3">
        <div class="relative flex-1">
          <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
          <input id="search-input" type="text" placeholder='Search or try "cheap spicy misal near Rankala"' 
            class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
        </div>
        <button type="submit" class="px-4 py-2 bg-gradient-misal text-white rounded-xl font-medium hover:opacity-90 flex items-center gap-2">
          <i data-lucide="search" class="w-4 h-4"></i> <span class="hidden sm:inline">Search</span>
        </button>
        <button type="button" id="mobile-filter-btn" class="px-4 py-2 bg-white border border-gray-200 text-gray-700 rounded-xl md:hidden">
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
        </button>
      </form>
      
      <div id="nlp-hint-container" class="hidden flex items-center gap-2 mt-3 p-2.5 bg-orange-50 rounded-xl border border-orange-200">
        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-orange-500 flex-shrink-0"></i>
        <span id="nlp-hint-text" class="text-xs text-orange-700"></span>
        <button id="clear-search-btn" class="ml-auto text-xs text-orange-500 hover:underline flex items-center gap-1">
          <i data-lucide="x" class="w-3 h-3"></i> Clear
        </button>
      </div>
    </div>

    <div class="flex gap-6">
      <!-- Sidebar Filters -->
      <aside id="filter-sidebar" class="hidden md:block w-72 flex-shrink-0 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 self-start sticky top-24">
        <div class="flex items-center justify-between mb-4 border-b pb-2">
          <h2 class="font-bold">Filters</h2>
          <button id="reset-filters-btn" class="text-xs text-orange-500 hover:underline">Reset All</button>
        </div>
        
        <!-- Filter Form -->
        <form id="filter-form" class="space-y-6">
          <!-- Sort -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Sort By</label>
            <select name="sort" class="w-full p-2 border border-gray-200 rounded-lg text-sm bg-gray-50 focus:border-orange-500 outline-none">
              <option value="relevance">Relevance</option>
              <option value="rating">Highest Rated</option>
              <option value="reviews">Most Reviews</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
            </select>
          </div>
          
          <!-- Area -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Area</label>
            <select name="area" class="w-full p-2 border border-gray-200 rounded-lg text-sm bg-gray-50 focus:border-orange-500 outline-none">
              <option value="">Any Area</option>
              <option value="Mahadwar Road">Mahadwar Road</option>
              <option value="Tarabai Park">Tarabai Park</option>
              <option value="Rankala">Rankala</option>
              <option value="Rajarampuri">Rajarampuri</option>
            </select>
          </div>
          
          <!-- Features -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Features</label>
            <div class="space-y-2">
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="open_now" class="rounded text-orange-500"> Open Now</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="veg" class="rounded text-orange-500"> Pure Veg</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="family_friendly" class="rounded text-orange-500"> Family Friendly</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="parking" class="rounded text-orange-500"> Parking</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="ac" class="rounded text-orange-500"> AC</label>
            </div>
          </div>
        </form>
      </aside>

      <!-- Results Area -->
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between mb-4">
          <p id="results-count" class="text-sm text-gray-500">Loading...</p>
        </div>
        
        <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
          <!-- Populated by JS -->
        </div>
        
        <div class="text-center mt-8 hidden" id="load-more-container">
          <button id="load-more-btn" class="px-6 py-2 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50">Load More</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/search.js"></script>
</body>
</html>
