<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - TasteKolhapur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-gradient-misal mx-auto flex items-center justify-center mb-4">
        <i data-lucide="utensils-crossed" class="text-white"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-900">Create Account</h2>
      <p class="text-gray-500 mt-2">Join TasteKolhapur community</p>
    </div>

    <form id="signup-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i data-lucide="user" class="w-4 h-4 text-gray-400"></i>
          </div>
          <input type="text" id="name" required
            class="pl-10 w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i data-lucide="mail" class="w-4 h-4 text-gray-400"></i>
          </div>
          <input type="email" id="email" required
            class="pl-10 w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i data-lucide="lock" class="w-4 h-4 text-gray-400"></i>
          </div>
          <input type="password" id="password" required minlength="6"
            class="pl-10 w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all">
        </div>
      </div>

      <button type="submit" id="submit-btn" class="w-full py-2.5 bg-gradient-misal text-white rounded-xl font-medium hover:opacity-90 transition-opacity">
        Create Account
      </button>
    </form>

    <p class="mt-8 text-center text-sm text-gray-600">
      Already have an account? 
      <a href="/login.html" class="text-orange-600 font-medium hover:text-orange-700">Sign in</a>
    </p>
  </div>

  <script type="module">
    import { initAuth, signUp, AuthState } from './js/auth.js';
    import { showGlobalLoading, showToast } from './js/utils.js';

    lucide.createIcons();
    initAuth();

    // Redirect if already logged in
    import { subscribeToAuth } from './js/auth.js';
    subscribeToAuth((user) => {
      if (user) window.location.href = '/index.html';
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      showGlobalLoading(true);
      const { error } = await signUp(email, password, name);
      showGlobalLoading(false);
      
      if (error) {
        alert('Error: ' + error.message);
      } else {
        showToast('Account created successfully!');
      }
    });
  </script>
</body>
</html>
